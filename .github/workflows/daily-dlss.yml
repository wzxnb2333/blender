name: daily dlss

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Fork branch/tag/commit (empty builds latest official Blender main)
        required: false
        default: ""
        type: string
      cuda_arch:
        description: Cycles CUDA architectures, separated by semicolons
        required: false
        default: sm_75;sm_86;sm_89;sm_90;sm_120;compute_75
        type: string
  schedule:
    # 10:17 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: daily-dlss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      CUDA_ARCH: ${{ inputs.cuda_arch || 'sm_75;sm_86;sm_89;sm_90;sm_120;compute_75' }}

    steps:
      - name: Checkout Blender fork
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Select source and fetch build assets
        id: source
        env:
          SOURCE_REF: ${{ inputs.ref }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git remote add upstream https://projects.blender.org/blender/blender.git
          if ($LASTEXITCODE) { throw 'Cannot add official upstream' }
          if (-not $env:SOURCE_REF) {
            git fetch --depth 1 upstream main
            if ($LASTEXITCODE) { throw 'Cannot fetch official Blender main' }
            git checkout --detach FETCH_HEAD
            if ($LASTEXITCODE) { throw 'Cannot select upstream commit' }
          }
          git lfs pull upstream --exclude='tests/**'
          if ($LASTEXITCODE) { throw 'Cannot download Blender build assets' }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve source commit' }
          $lib = (git ls-tree HEAD lib/windows_x64) -split '\s+'
          if ($LASTEXITCODE -or $lib.Length -lt 3) { throw 'Windows library revision is missing' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "libs=$($lib[2])" >> $env:GITHUB_OUTPUT
          "BLENDER_SHA=$sha" >> $env:GITHUB_ENV
          "BUILD_DIR=$env:RUNNER_TEMP\blender-build" >> $env:GITHUB_ENV
          "PACKAGE_DIR=$env:RUNNER_TEMP\daily-dlss" >> $env:GITHUB_ENV

      - name: Restore official Windows libraries
        id: libs
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/windows_x64
            .git/modules/lib/windows_x64
          key: blender-windows-x64-${{ steps.source.outputs.libs }}

      - name: Fetch official Windows libraries
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git config --local submodule.lib/windows_x64.update checkout
          git submodule update --init --checkout --depth 1 lib/windows_x64
          if ($LASTEXITCODE) { throw 'Windows library checkout failed' }
          git -C lib/windows_x64 lfs pull
          if ($LASTEXITCODE) { throw 'Windows library download failed' }

      - name: Save official Windows libraries
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/windows_x64
            .git/modules/lib/windows_x64
          key: ${{ steps.libs.outputs.cache-primary-key }}

      - name: Checkout DLSS SDK headers (v310.9.1)
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: 374959484e79a640feaba44c93ac8cfb0a03f5b5
          path: third_party/DLSS
          persist-credentials: false
          sparse-checkout: |
            include
          lfs: false

      - name: Checkout OptiX SDK headers (v9.0.0)
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/optix-dev
          ref: fff65c2a7c592f1ea5f1661ad7d2381cf965f9bd
          path: third_party/OptiX
          persist-credentials: false

      - name: Install CUDA compiler and runtime headers
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: false

      - name: Set up MSVC environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or -not $vs) { throw 'Visual Studio C++ tools were not found' }
          $batch = Join-Path $env:RUNNER_TEMP 'daily-dlss-msvc.cmd'
          "@call `"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul`n@if errorlevel 1 exit /b 1`n@set" | Set-Content $batch
          $vars = & cmd /d /c $batch
          if ($LASTEXITCODE) { throw 'Visual Studio environment setup failed' }
          foreach ($line in $vars) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsRedistDir)=(.*)$') {
              $line >> $env:GITHUB_ENV
            }
          }

      - name: Configure Release with DLSS, CUDA and OptiX
        run: |
          if ($env:CUDA_ARCH -notmatch '^(sm|compute)_[0-9]+(;(?:sm|compute)_[0-9]+)*$') {
            throw 'Invalid CUDA architectures; use e.g. sm_89;compute_75'
          }
          & nvcc --version
          if ($LASTEXITCODE) { throw 'CUDA compiler is unavailable' }
          $cmakeArgs = @(
            '-S', $env:GITHUB_WORKSPACE, '-B', $env:BUILD_DIR,
            '-G', 'Visual Studio 17 2022', '-A', 'x64',
            '-C', "$env:GITHUB_WORKSPACE/build_files/cmake/config/blender_release.cmake",
            "-DCMAKE_INSTALL_PREFIX=$env:PACKAGE_DIR",
            "-DDLSS_SDK_ROOT=$env:GITHUB_WORKSPACE/third_party/DLSS",
            "-DOPTIX_ROOT_DIR=$env:GITHUB_WORKSPACE/third_party/OptiX",
            "-DCUDA_TOOLKIT_ROOT_DIR=$env:CUDA_PATH",
            "-DCYCLES_CUDA_BINARIES_ARCH=$env:CUDA_ARCH",
            '-DWITH_DLSS=ON', '-DWITH_CYCLES_DEVICE_CUDA=ON',
            '-DWITH_CYCLES_DEVICE_OPTIX=ON', '-DWITH_CYCLES_CUDA_BINARIES=ON',
            '-DWITH_CYCLES_CUDA_BUILD_SERIAL=ON',
            '-DWITH_CYCLES_HIP_BINARIES=OFF', '-DWITH_CYCLES_ONEAPI_BINARIES=OFF',
            '-DWITH_CYCLES_HIPRT=OFF', '-DWITH_GTESTS=OFF'
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Build and install portable Blender
        run: |
          & cmake --build $env:BUILD_DIR --target INSTALL --config Release -- /m:2 /verbosity:minimal
          if ($LASTEXITCODE) { throw "Blender build failed: $LASTEXITCODE" }

      - name: Verify compiled features and GPU kernels
        run: |
          $blender = Join-Path $env:PACKAGE_DIR 'blender.exe'
          if (-not (Test-Path $blender)) { throw 'Installed blender.exe is missing' }
          $check = "import _cycles; assert _cycles.with_dlss, 'DLSS disabled'; d = _cycles.get_device_types(); assert d[0] and d[1], ('CUDA/OptiX disabled', d); print('DLSS, CUDA, OptiX compile checks passed')"
          & $blender --background --factory-startup --python-exit-code 1 --python-expr $check
          if ($LASTEXITCODE) { throw "Blender self-check failed: $LASTEXITCODE" }
          $kernels = @(Get-ChildItem $env:PACKAGE_DIR -Recurse -File -Filter '*.cubin*')
          $ptx = @(Get-ChildItem $env:PACKAGE_DIR -Recurse -File -Filter '*.ptx*')
          if (-not $kernels.Count -or -not $ptx.Count) { throw 'Packaged CUDA/OptiX kernels are missing' }

      - name: Package ZIP and record source versions
        env:
          LIB_SHA: ${{ steps.source.outputs.libs }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $dlss = git -C third_party/DLSS rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve DLSS SDK commit' }
          $optix = git -C third_party/OptiX rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve OptiX SDK commit' }
          @"
          daily dlss - Windows x64 portable Blender
          Blender source: https://projects.blender.org/blender/blender/commit/$env:BLENDER_SHA
          Blender commit: $env:BLENDER_SHA
          Windows libraries: $env:LIB_SHA
          DLSS SDK v310.9.1: $dlss
          OptiX SDK v9.0.0: $optix
          CUDA compiler: 12.9.1
          CUDA architectures: $env:CUDA_ARCH

          Compile checks passed for DLSS, CUDA and OptiX. Actual GPU rendering is
          not tested on the GitHub runner. DLSS needs a compatible NVIDIA RTX GPU
          and driver. This build does not bundle NVIDIA DLSS runtime DLLs.
          Select Cycles > Sampling > Viewport > Denoise > DLSS to try it.
          SDK version 310.9.1 alone does not prove a DLSS 4.5 runtime/model is active.
          "@ | Set-Content -Encoding utf8 (Join-Path $env:PACKAGE_DIR 'DAILY_DLSS_README.txt')
          $zip = Join-Path $env:GITHUB_WORKSPACE "daily-dlss-$env:RUN_NUMBER-windows-x64.zip"
          & 7z a -tzip -mx=3 $zip "$env:PACKAGE_DIR\*"
          if ($LASTEXITCODE) { throw "ZIP packaging failed: $LASTEXITCODE" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content -Encoding ascii "$zip.sha256"
          "Built Blender ``$env:BLENDER_SHA`` with DLSS, CUDA and OptiX. Download the ZIP from Artifacts." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload portable Blender
        uses: actions/upload-artifact@v4
        with:
          name: daily-dlss-${{ github.run_number }}-windows-x64
          path: |
            daily-dlss-*-windows-x64.zip
            daily-dlss-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
